services:
  postgres:
    image: postgres:16-alpine
    container_name: collectify_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-collectify}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - collectify_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: collectify_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - collectify_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  collectify_postgres_data:
  collectify_pgadmin_data:
