# Railway config-as-code for the `api` service. This file must live inside
# apps/api because Railway's "Root Directory" for this service must be set
# to apps/api in the dashboard (Settings → Source) — that setting has no
# config-as-code equivalent, this file alone does not scope the build to
# this folder. See the staging section of docs/ENVIRONMENT_VARIABLES.md for
# the full deploy walkthrough (env vars, Postgres plugin wiring, etc.).

[build]
# No `builder` override — Railpack (Railway's current default builder,
# replacing the now-maintenance-mode Nixpacks) auto-detects this as a
# standard Node project once Root Directory is correctly scoped above.
buildCommand = "npm run build"

[deploy]
# migration:run is idempotent (TypeORM skips migrations already recorded in
# the `migrations` table), so running it before every start is safe and
# keeps the deployed schema from ever drifting out of sync with a merge to
# main — see docs/DATABASE.md on migrations-only schema changes.
startCommand = "npm run migration:run && npm run start:prod"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
